name: Auto Version & Publish NuGet

on:
  workflow_dispatch:
    inputs:
        existing_tag:
          description: Existing release tag to publish without incrementing the version
          required: false
          type: string
  push:
    branches: [ "main" ]
    paths: [ "src/**" ]

jobs:
  increment-version:
    if: github.ref == 'refs/heads/main' && inputs.existing_tag == ''
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUBACCESSTOKEN }}

    - name: Import GPG & Enable Git Signing
      # You may pin to the exact commit or the version.
      # uses: crazy-max/ghaction-import-gpg@111c56156bcc6918c056dbef52164cfa583dc549
      uses: crazy-max/ghaction-import-gpg@v5.2.0
      with:
        gpg_private_key: ${{ secrets.COMMIT_SIGNINGKEY }}
        git_config_global: true
        git_user_signingkey: true
        git_commit_gpgsign: true
        git_tag_gpgsign: true
        git_push_gpgsign: true
  
    - name: Reset Origin
      run: |
        git remote set-url origin "https://cbcrouse:${{ secrets.GITHUBACCESSTOKEN }}@github.com/cbcrouse/ServiceComposition.NET.git"
        git checkout ${{ github.ref_name }}

    - name: Install Versioning.NET
      run: |
        dotnet tool install --global Versioning.NET

    - name: Increment Version
      run: |
        dotnet-version increment-version-with-git-hints -g "." --branch-name ${{ github.ref_name }} --author-email ${{ vars.COMMIT_SIGNING_EMAIL }}

  publish-nuget:
    needs: increment-version
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && (needs.increment-version.result == 'success' || (needs.increment-version.result == 'skipped' && inputs.existing_tag != ''))
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the existing release tag
        if: inputs.existing_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.existing_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected a version tag such as v3.0.0"
            exit 1
          fi
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" HEAD
          git checkout --detach "refs/tags/$RELEASE_TAG"

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '11.x'

      - name: Restore NuGet packages
        run: dotnet restore src/ServiceComposition.NET/ServiceComposition.NET.csproj

      - name: Pack project
        run: dotnet pack src/ServiceComposition.NET/ServiceComposition.NET.csproj --configuration Release --no-restore /m

      - name: Authenticate with NuGet.org
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget_login
        with:
          user: cbcrouse

      - name: Publish
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          NUGET_SOURCE: https://api.nuget.org/v3/index.json
        run: dotnet nuget push "src/ServiceComposition.NET/bin/Release/*.nupkg" --skip-duplicate --api-key "$NUGET_API_KEY" --source "$NUGET_SOURCE"
